name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    # macOS only: the microphone grant, the menu-bar shell and the push path are
    # all macOS-shaped (see docs/adr/0005).
    runs-on: macos-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install
        run: python -m pip install --upgrade pip && python -m pip install -e '.[dev]'

      - name: Lint
        run: ruff check .

      - name: Format
        run: ruff format --check .

      - name: Test
        run: pytest

  shell:
    # The menu-bar shell, checked in its own job so a Swift failure reads as a
    # Swift failure. "The shell builds" is #11's own acceptance, and this is
    # where that sentence is proved — leaving it to the packaging ticket would
    # mean main could break the shell and the packaging ticket would be the one
    # to find out.
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: swift build --package-path shell

      # swift-testing is an explicit test-only dependency, because a checkout
      # with only the Command Line Tools has neither it nor XCTest in the
      # toolchain. `--disable-xctest` is what makes that the harness that runs.
      - name: Test
        run: swift test --package-path shell --disable-xctest

      - name: Format
        run: |
          cd shell
          swift format lint --recursive --strict Sources Tests Package.swift
